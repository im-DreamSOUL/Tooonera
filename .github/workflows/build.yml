name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix Project Structure and Gradle File
      run: |
        if [ -d "App" ] && [ ! -d "app" ]; then
          mv App app
        fi
        
        # Ensure settings.gradle exists
        if [ ! -f "settings.gradle" ]; then
          echo "include ':app'" > settings.gradle
        fi

        # Ensure app/build.gradle has the android application plugin
        if [ -f "app/build.gradle" ]; then
          if ! grep -q "com.android.application" app/build.gradle; then
            echo "plugins { id 'com.android.application' }" | cat - app/build.gradle > temp && mv temp app/build.gradle
          fi
        fi

    - name: Download and Setup Gradle 8.5
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Build APK
      run: |
        cd app
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
