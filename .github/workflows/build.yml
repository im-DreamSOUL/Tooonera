name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Replace With Fresh Clean Build Gradle
      run: |
        # Delete old messy build.gradle and create a clean standard one
        rm -f build.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        apply plugin: 'com.android.application'

        android {
            namespace 'com.tooonera.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.tooonera.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        # Ensure settings.gradle exists
        if [ ! -f "settings.gradle" ]; then
            echo "rootProject.name = 'Tooonera'" > settings.gradle
        fi

    - name: Download and Setup Gradle 8.13
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
        unzip -q gradle-8.13-bin.zip
        echo "$PWD/gradle-8.13/bin" >> $GITHUB_PATH

    - name: Build APK
      run: |
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/outputs/apk/debug/*.apk
