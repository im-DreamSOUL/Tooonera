name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clean and Fix Build Gradle via Python
      run: |
        python3 -c "
        with open('build.gradle', 'r') as f:
            content = f.read()

        # Remove existing clean task definitions safely
        import re
        content = re.sub(r'task\s+clean\s*\(.*?\)\s*\{.*?\}', '', content, flags=re.DOTALL)
        content = re.sub(r'task\s+clean\s*\{.*?\}', '', content, flags=re.DOTALL)

        # Append plugin if missing
        if 'com.android.application' not in content:
            content += \"\napply plugin: 'com.android.application'\n\"

        with open('build.gradle', 'w') as f:
            f.write(content)
        "

    - name: Download and Setup Gradle 8.13
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
        unzip -q gradle-8.13-bin.zip
        echo "$PWD/gradle-8.13/bin" >> $GITHUB_PATH

    - name: Build APK
      run: |
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/outputs/apk/debug/*.apk
