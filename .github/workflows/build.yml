name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Safely Apply Android Plugin
      run: |
        if [ -f "build.gradle" ]; then
          if ! grep -q "com.android.application" build.gradle; then
            echo "apply plugin: 'com.android.application'" >> build.gradle
          fi
        else
          echo "Error: build.gradle not found in root!"
          exit 1
        fi

    - name: Download and Setup Gradle 8.13
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
        unzip -q gradle-8.13-bin.zip
        echo "$PWD/gradle-8.13/bin" >> $GITHUB_PATH

    - name: Build APK
      run: |
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/outputs/apk/debug/*.apk
