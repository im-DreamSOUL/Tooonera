name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Force Fix Project Structure & Gradle Config
      run: |
        if [ -d "App" ] && [ ! -d "app" ]; then
          mv App app
        fi
        
        # Ensure settings.gradle exists and includes app
        echo "include ':app'" > settings.gradle

        # Force inject android application plugin into app/build.gradle if missing
        if [ -f "app/build.gradle" ]; then
          if ! grep -q "com.android.application" app/build.gradle; then
            sed -i "1i plugins { id 'com.android.application' }" app/build.gradle
          fi
        else
          echo "Error: app/build.gradle not found!"
          exit 1
        fi

    - name: Download and Setup Gradle 8.5
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Build APK
      run: |
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
