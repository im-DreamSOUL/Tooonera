name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix Source Directories and Manifest
      run: |
        # Ensure standard Android source structure exists
        mkdir -p src/main
        
        # If AndroidManifest.xml is placed elsewhere, find and move it, or create a basic one
        if [ ! -f "src/main/AndroidManifest.xml" ]; then
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml src/main/
          else
            # Create a fallback manifest if missing entirely
            cat << 'EOF' > src/main/AndroidManifest.xml
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.tooonera.app">
    <application
        android:allowBackup="true"
        android:label="Tooonera"
        android:supportsRtl="true">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF
          fi
        fi

        # Replace build.gradle with clean standard configuration
        rm -f build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        apply plugin: 'com.android.application'

        android {
            namespace 'com.tooonera.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.tooonera.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        if [ ! -f "settings.gradle" ]; then
            echo "rootProject.name = 'Tooonera'" > settings.gradle
        fi

    - name: Download and Setup Gradle 8.13
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
        unzip -q gradle-8.13-bin.zip
        echo "$PWD/gradle-8.13/bin" >> $GITHUB_PATH

    - name: Build APK
      run: |
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/outputs/apk/debug/*.apk
